# Alembic configuration for the Cloud Pipelines backend database.
#
# Migrations are applied automatically on startup by
# `cloud_pipelines_backend.database_ops.upgrade_db_schema`, which builds an
# equivalent Config in Python. This file exists for driving Alembic from the
# command line, from the repository root:
#
#     # Show the current and the available revisions
#     alembic current
#     alembic history
#
#     # Apply all pending migrations
#     alembic upgrade head
#
#     # Create a new migration after editing `backend_types_sql.py`.
#     # Always pass an explicit `--rev-id`: this project uses sequential
#     # revision ids (0001, 0002, ...) rather than Alembic's random hashes.
#     alembic revision --autogenerate -m "Add the foo column" --rev-id 0003
#
#     # Print the SQL instead of running it (useful for reviewing a migration
#     # before applying it to a production database)
#     alembic upgrade 0002:head --sql
#
# The target database is read from the `DATABASE_URI` (or `DATABASE_URL`)
# environment variable -- the same variables the API server uses. See
# `cloud_pipelines_backend/migrations/env.py`.

[alembic]
script_location = cloud_pipelines_backend/migrations

# Makes the `cloud_pipelines_backend` package importable from `env.py` when
# Alembic is invoked from the repository root.
prepend_sys_path = .

# Date-prefixed file names so that revisions sort chronologically on disk.
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# Intentionally empty: `env.py` reads the URL from the environment.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
